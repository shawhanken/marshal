<title>Cowboy 概念登記</title>
<style>
  :root{
    --app-bg:#eef0f3; --bar:rgba(246,246,248,.8); --canvas:#f5f6f8; --panel:rgba(248,248,250,.86);
    --node:#ffffff; --text:#1d1d1f; --text2:#86868b; --text3:#a1a1a6;
    --sep:rgba(0,0,0,.09); --hover:rgba(0,0,0,.05); --sel:#007aff; --sel-text:#ffffff;
    --chip:rgba(0,0,0,.055); --chip-brd:rgba(0,0,0,.09);
    --link:rgba(60,60,67,.24); --node-brd:rgba(0,0,0,.1); --node-sh:0 1px 2px rgba(0,0,0,.08),0 3px 8px -4px rgba(0,0,0,.14);
    --tier-c:#ff3b30; --tier-h:#5e5ce6; --tier-m:#8e8e93; --ok:#28a745; --spec:#e08600;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"PingFang SC",sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --app-bg:#161618; --bar:rgba(38,38,40,.82); --canvas:#1a1a1c; --panel:rgba(34,34,37,.9);
      --node:#2c2c2e; --text:#f5f5f7; --text2:#98989d; --text3:#6c6c70;
      --sep:rgba(255,255,255,.1); --hover:rgba(255,255,255,.06); --sel:#0a84ff; --sel-text:#ffffff;
      --chip:rgba(255,255,255,.08); --chip-brd:rgba(255,255,255,.13);
      --link:rgba(235,235,245,.24); --node-brd:rgba(255,255,255,.12); --node-sh:0 1px 2px rgba(0,0,0,.4),0 4px 12px -4px rgba(0,0,0,.5);
      --tier-c:#ff453a; --tier-h:#8783ff; --tier-m:#98989d; --ok:#30d158; --spec:#ffb340;
    }
  }
  :root[data-theme="light"]{
    --app-bg:#eef0f3; --bar:rgba(246,246,248,.8); --canvas:#f5f6f8; --panel:rgba(248,248,250,.86);
    --node:#ffffff; --text:#1d1d1f; --text2:#86868b; --text3:#a1a1a6;
    --sep:rgba(0,0,0,.09); --hover:rgba(0,0,0,.05); --sel:#007aff; --sel-text:#ffffff;
    --chip:rgba(0,0,0,.055); --chip-brd:rgba(0,0,0,.09);
    --link:rgba(60,60,67,.24); --node-brd:rgba(0,0,0,.1); --node-sh:0 1px 2px rgba(0,0,0,.08),0 3px 8px -4px rgba(0,0,0,.14);
    --tier-c:#ff3b30; --tier-h:#5e5ce6; --tier-m:#8e8e93; --ok:#28a745; --spec:#e08600;
  }
  :root[data-theme="dark"]{
    --app-bg:#161618; --bar:rgba(38,38,40,.82); --canvas:#1a1a1c; --panel:rgba(34,34,37,.9);
    --node:#2c2c2e; --text:#f5f5f7; --text2:#98989d; --text3:#6c6c70;
    --sep:rgba(255,255,255,.1); --hover:rgba(255,255,255,.06); --sel:#0a84ff; --sel-text:#ffffff;
    --chip:rgba(255,255,255,.08); --chip-brd:rgba(255,255,255,.13);
    --link:rgba(235,235,245,.24); --node-brd:rgba(255,255,255,.12); --node-sh:0 1px 2px rgba(0,0,0,.4),0 4px 12px -4px rgba(0,0,0,.5);
    --tier-c:#ff453a; --tier-h:#8783ff; --tier-m:#98989d; --ok:#30d158; --spec:#ffb340;
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--sans);color:var(--text);background:var(--app-bg);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    height:100vh;display:flex;flex-direction:column;overflow:hidden;
  }

  /* ---- unified toolbar ---- */
  .toolbar{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:11px 22px;background:var(--bar);border-bottom:.5px solid var(--sep);
    backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);z-index:5;
  }
  .brand{display:flex;align-items:baseline;gap:10px;margin-right:6px}
  .brand h1{font-size:16px;font-weight:650;margin:0;letter-spacing:-.2px}
  .brand .sub{font-size:12px;color:var(--text3);font-variant-numeric:tabular-nums}
  .seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px;gap:2px}
  .seg button{font-family:inherit;font-size:12.5px;font-weight:500;color:var(--text);
    border:0;background:transparent;padding:5px 13px;border-radius:6px;cursor:pointer;
    transition:background .12s,box-shadow .12s;white-space:nowrap}
  .seg button[aria-pressed="true"]{background:var(--node);box-shadow:0 1px 2px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.05)}
  @media (prefers-color-scheme:dark){.seg button[aria-pressed="true"]{background:#5a5a5e;box-shadow:0 1px 3px rgba(0,0,0,.4)}}
  .search{margin-left:auto;display:flex;align-items:center;background:var(--chip);
    border:.5px solid var(--chip-brd);border-radius:8px;padding:0 10px;height:30px;flex:0 1 280px;min-width:170px}
  .search svg{width:13px;height:13px;fill:var(--text3);flex:0 0 auto}
  .search input{border:0;background:transparent;outline:none;font-family:inherit;font-size:13px;color:var(--text);padding:0 7px;width:100%}
  .search input::placeholder{color:var(--text3)}

  /* ---- split: tree canvas + inspector ---- */
  .split{flex:1 1 auto;display:flex;min-height:0}
  .canvas{flex:1 1 auto;overflow:auto;background:var(--canvas);position:relative;min-width:0}
  .stage{position:relative}
  svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  svg.links path{fill:none;stroke:var(--link);stroke-width:1.6}
  svg.links path.hot{stroke:var(--sel);stroke-width:2.2}

  .node{
    position:absolute;display:flex;align-items:center;gap:8px;
    height:32px;padding:0 12px 0 11px;border-radius:9px;background:var(--node);
    border:1px solid var(--node-brd);box-shadow:var(--node-sh);cursor:pointer;
    font-size:13.5px;font-weight:550;white-space:nowrap;transition:transform .12s,box-shadow .12s,border-color .12s;
  }
  .node:hover{transform:translateY(-1px);box-shadow:0 4px 14px -4px rgba(0,0,0,.28)}
  .node .ndot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 .5px rgba(0,0,0,.12) inset}
  .node .ndot.c{background:var(--tier-c)}.node .ndot.h{background:var(--tier-h)}.node .ndot.m{background:var(--tier-m)}
  .node .nlabel{overflow:hidden;text-overflow:ellipsis}
  .node .kidcount{font-size:10.5px;color:var(--text3);font-variant-numeric:tabular-nums;
    background:var(--chip);border-radius:9px;padding:0 6px;line-height:16px;flex:0 0 auto}
  .node.draft{border-style:dashed;background:transparent}
  .node.draft .nlabel{color:var(--text2)}
  .node.sel{border-color:var(--sel);box-shadow:0 0 0 2.5px color-mix(in srgb,var(--sel) 30%,transparent),var(--node-sh)}
  .node.root{font-weight:680;font-size:14px;height:34px}
  .node.dim{opacity:.32}

  .hint{position:sticky;top:0;left:0;font-size:11.5px;color:var(--text3);padding:8px 14px;pointer-events:none}

  /* ---- inspector ---- */
  .inspector{flex:0 0 clamp(320px,34%,400px);background:var(--panel);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-left:.5px solid var(--sep);overflow-y:auto;min-width:0}
  .insp-pad{padding:26px 26px 44px}
  .empty{color:var(--text2);font-size:14px;line-height:1.65}
  .empty h2{color:var(--text);font-size:21px;margin:0 0 8px;font-weight:650;letter-spacing:-.3px}
  .empty code{font-family:var(--mono);font-size:12px;background:var(--chip);padding:1px 5px;border-radius:4px}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:22px 0 4px}
  .stat{background:var(--chip);border:.5px solid var(--chip-brd);border-radius:11px;padding:14px 15px}
  .stat .n{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.6px}
  .stat .l{font-size:11.5px;color:var(--text2);margin-top:2px}

  .ihead{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .ihead h1{font-size:25px;font-weight:680;margin:0;letter-spacing:-.5px;word-break:break-word}
  .ihead .tid{font-family:var(--mono);font-size:11.5px;color:var(--text2);background:var(--chip);padding:2px 7px;border-radius:6px}
  .pills{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0 4px}
  .pill{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;letter-spacing:.2px}
  .pill.tier{color:#fff}
  .pill.tier.c{background:var(--tier-c)}.pill.tier.h{background:var(--tier-h)}.pill.tier.m{background:var(--tier-m)}
  .pill.tier .pd{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.9)}
  .pill.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
  .pill.spec{background:transparent;border:1px solid var(--spec);color:var(--spec)}
  .pill.parent{background:var(--chip);border:.5px solid var(--chip-brd);color:var(--text);cursor:pointer}
  .pill.parent:hover{background:var(--hover)}
  .desc{font-size:13.5px;line-height:1.72;color:var(--text);margin:18px 0 6px}
  .desc code{font-family:var(--mono);font-size:12px;background:var(--chip);padding:1px 5px;border-radius:4px}
  .sec{margin-top:22px}
  .sec h3{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);
    margin:0 0 9px;display:flex;align-items:center;gap:8px}
  .sec h3 .cnt{color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums;background:var(--chip);border-radius:10px;padding:1px 7px;font-size:10px;letter-spacing:0}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{font-size:12.5px;padding:5px 11px;border-radius:8px;background:var(--chip);border:.5px solid var(--chip-brd);
    color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s;font-weight:500}
  .chip:hover{background:var(--hover)}
  .chip.static,.chip.static:hover{cursor:default;background:var(--chip)}
  .chip .cd{width:8px;height:8px;border-radius:50%}
  .chip.cip{font-family:var(--mono);font-size:11.5px}
  .none{color:var(--text3);font-size:13px;font-style:italic}
  .blast{background:var(--chip);border:.5px solid var(--chip-brd);border-radius:11px;padding:14px 15px;margin-top:9px}
  .blast .top{display:flex;align-items:baseline;gap:10px}
  .blast .bn{font-size:26px;font-weight:680;font-variant-numeric:tabular-nums;letter-spacing:-.6px}
  .blast .bl{font-size:12.5px;color:var(--text2)}
  .blast .note{font-size:12px;color:var(--text3);margin-top:6px;line-height:1.55}

  /* ---- footer status ---- */
  .statusbar{flex:0 0 auto;height:32px;display:flex;align-items:center;gap:16px;padding:0 22px;
    background:var(--bar);border-top:.5px solid var(--sep);font-size:11.5px;color:var(--text2);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
  .statusbar .s{display:inline-flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
  .statusbar .s .d{width:8px;height:8px;border-radius:50%}
  .legend{display:inline-flex;gap:13px;align-items:center}
  .statusbar .grow{margin-left:auto}

  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-thumb{background:rgba(140,140,150,.4);border-radius:7px;border:3px solid transparent;background-clip:padding-box}
  ::-webkit-scrollbar-thumb:hover{background:rgba(140,140,150,.6);background-clip:padding-box}
  ::-webkit-scrollbar-track{background:transparent}
  :focus-visible{outline:2px solid var(--sel);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:760px){
    .split{flex-direction:column}
    .inspector{flex:0 0 46%;border-left:0;border-top:.5px solid var(--sep)}
    .brand .sub{display:none}
  }
</style>

<div class="toolbar">

  <div class="seg" role="group" aria-label="按狀態篩選">

<div class="split">

</div>

<div class="statusbar">
  <span class="legend" aria-label="tier 圖例">

</div>

<script id="data" type="application/json">[{"id": "actor-model", "parent": "execution", "importance": "high", "status": "authoritative", "deps": ["pvm"], "specs": ["CIP-1"], "desc": "Cowboy 核心计算抽象：每个链上合约是一个 Actor（独立状态 + PVM Python 代码 + 独立邮箱），仅通过消息通信，无共享内存。`send_message` 异步入 mailbox，`call_actor` 同步递归（最深 32 层）。"}, {"id": "basefee", "parent": "economics", "importance": "constitutional", "status": "authoritative", "deps": ["gas"], "specs": ["CIP-3", "CIP-5"], "desc": "Cycles 与 Cells 各维护独立 basefee，每块按几何反馈规则更新（`Δ = basefee × |used−target| / target / ALPHA`，双向 clamp）。状态持久化在系统 Actor `0x06`（DUAL_BASEFEE）；basefee 部分 100% burn，tip 按 SettlementConfig 分配。"}, {"id": "consensus", "parent": "node", "importance": "high", "status": "authoritative", "deps": [], "specs": [], "desc": "Cowboy 用 Simplex BFT。`Application` 实现三阶段回调：Leader `propose` 块、验证者 `verify`（独立重放比对 Merkle roots）、多数通过后 `report` 提交。`Mempool` 维护 per-account nonce 队列。"}, {"id": "continuation", "parent": "execution", "importance": "mid", "status": "authoritative", "deps": ["pvm", "actor-model"], "specs": ["CIP-6"], "desc": "当 Actor 发起异步操作（跨 Actor 调用、Runner 任务、Timer）时，Python 函数用 Checkpoint 挂起并在结果回来后恢复。支持函数级（F-checkpoint，保存局部变量 + 指令指针）与 Block Stack（try/finally/loop 上下文）两层；序列化用 CBOR Canonical（避免 pickle 任意代码执行）。"}, {"id": "cross-chain", "parent": null, "importance": "mid", "status": "draft", "deps": ["vrf-runner-selection", "settlement-slashing"], "specs": ["CIP-25"], "desc": "把 Cowboy 跨链能力分成三个正交层：L1 状态锚定（BlockCommitment + Merkle 证明原语）、L2 消息（mailbox，exactly-once + 单调序）、L3 应用（asset bridge / oracle / generic call）。L1 信任后端可插拔（runner committee / ZK / optimistic / native LC），swap 不破坏 L2/L3 不变量。"}, {"id": "custom-domains", "parent": "gateway", "importance": "mid", "status": "draft", "deps": ["dns-addressable-actors", "runner-verification"], "specs": ["CIP-16"], "desc": "扩展 Route Registry 到两类命名：协议自有 `.cow` / `.cowboy` TLD，与外部 FQDN（如 `api.example.com`，经 DNS TXT 挑战证明控制）。外部域绑定用 CIP-2 multi-runner verifier 的 `MajorityVote` + `DnsTxtRecordMatch`/`DnsCnameMatch`（各查 ≥3 独立 resolver），完成后经 `Extern"}, {"id": "dns-addressable-actors", "parent": "gateway", "importance": "mid", "status": "draft", "deps": ["route-registry"], "specs": ["CIP-14"], "desc": "让 Cowboy actor 经 HTTP 可达的 ingress 路由层。核心：`ingress.http` entitlement、Route Registry（`0x0D`）、Gateway Registry（`0x0E`）、Receipt Registry（`0x0F`）；请求分 read-only 路径（`read_handler` RPC，无共识，mutating syscall 全 trap）与 command 路径（`I"}, {"id": "dual-gas-model", "parent": "execution", "importance": "constitutional", "status": "authoritative", "deps": ["gas", "basefee"], "specs": ["CIP-3"], "desc": "Cowboy 分离**计算(Cycles)**与**数据(Cells)**两种稀缺资源,各自独立 EIP-1559"}, {"id": "economics", "parent": null, "importance": "high", "status": "authoritative", "deps": [], "specs": ["CIP-3"], "desc": "Cowboy 的费用、gas、结算与惩罚顶层域：双计量 gas（Cycles + Cells）、EIP-1559 basefee、tip 分配、runner 结算与 slashing、治理可调参数。所有链上稀缺资源定价与价值守恒都归此域。"}, {"id": "execution", "parent": "node", "importance": "high", "status": "authoritative", "deps": ["pvm", "storage"], "specs": ["CIP-1", "CIP-3"], "desc": "块执行的主入口。`ExecutionEngine` 逐笔分派交易（System / Actor 指令）、校验 basefee、扣 gas、burn/tip 分账，并驱动 PVM handler。子模块含 basefee 管理、双 gas 计量、runner/token 指令处理。"}, {"id": "gas", "parent": "economics", "importance": "constitutional", "status": "authoritative", "deps": [], "specs": ["CIP-3"], "desc": "CIP-3 双计量：`GasCosts` 定义所有 per-op 常量，`DualGasMeters` 分别累计 Cycles（计算）与 Cells（数据），`GasReport` 给分类明细。改动它牵动全链数值守恒，故 importance=constitutional。"}, {"id": "gateway", "parent": null, "importance": "mid", "status": "draft", "deps": [], "specs": ["CIP-14", "CIP-15", "CIP-16"], "desc": "CIP-14 v2 引入的第一个 ingress 节点角色（与 Runner/Validator/Relay 并列），负责 TLS 终止、DNS 解析、read-only `read_handler` 执行、command 路径 `IngressDispatch` 中介、静态资产 serving。"}, {"id": "governance", "parent": "economics", "importance": "mid", "status": "draft", "deps": ["settlement-slashing"], "specs": ["CIP-12"], "desc": "`0x09 GOVERNANCE` 系统 Actor 承载治理参数。CIP-12 完整设计是双院投票（质押 CBY + 验证者一人一票）+ Security Council + Tier 0-4 提案分类，属 Draft/spec-only。"}, {"id": "mcp-ingress", "parent": "gateway", "importance": "mid", "status": "draft", "deps": ["dns-addressable-actors", "payments"], "specs": ["CIP-19"], "desc": "让每个 CIP-14 actor 自动成为 MCP server：Gateway 在 `/_cowboy/mcp` terminate MCP streamable HTTP，`tools/list` 从 CIP-15 路由表自动派生（每个 method route 一个 tool），`tools/call` 翻译成 CIP-14 query/command dispatch，付款复用 CIP-18 wire。Actor handler"}, {"id": "mpp-session", "parent": "economics", "importance": "mid", "status": "authoritative", "deps": ["settlement-slashing", "runner-verification"], "specs": ["CIP-8"], "desc": "「链上托管 + 链下累积 voucher + 链上结算」通道模型，把 N 次 Runner 微调用的链上开销从 N 笔摊到 3 笔（Open/Settle/Finalize）。对接 Stripe/Tempo 的 Machine Payment Protocol；voucher 用 EIP-712 cumulative 金额，Settle 按 89/10/1 分账（复用 `SettlementConfig`）。"}, {"id": "node", "parent": null, "importance": "high", "status": "authoritative", "deps": [], "specs": [], "desc": "Cowboy L1 全节点（独立 Rust workspace `node/`），跑 Simplex BFT 共识与投机执行。顶层协调器 `chain::Engine` 串起 mempool、执行引擎与共识回调（`Application` 的 propose/verify/report 三阶段）。"}, {"id": "payments", "parent": "gateway", "importance": "mid", "status": "draft", "deps": ["dns-addressable-actors"], "specs": ["CIP-18"], "desc": "给 CIP-14 actor 补外部付款入口：Gateway 边缘强制 + 链上 `PaymentGate (0x11)` 统一结算 + 四种付款模型（per-request / actor-funded / prepaid pass / epoch subscription）+ 双 wire（MPP 主、x402 兼容，normalize 成同一 PaymentIntent）+ 多资产（CBY + CIP-20 + 桥接稳定币）。"}, {"id": "public-asset-hosting", "parent": "gateway", "importance": "mid", "status": "draft", "deps": ["dns-addressable-actors"], "specs": ["CIP-15", "CIP-9"], "desc": "扩展 CIP-14，让 Gateway 从 CIP-9 public volume 直接服务静态文件（HTML/CSS/JS/图片），绕过 actor 的 `http.request` handler（zero PVM cycles）。核心是存于 `STORAGE_MANAGER (0x0A)` 的 route manifest，声明哪些 URL 路径走 static vs dynamic；严格优先级 `min(dynamic.prio"}, {"id": "pvm", "parent": "node", "importance": "high", "status": "authoritative", "deps": [], "specs": ["CIP-6"], "desc": "基于 RustPython 的确定性 Python 运行时（`node/pvm/`，workspace-excluded）。`PvmExecutor::execute_handler` 加载 actor 代码 + checkpoint、注入 `INT_GUARD_PREAMBLE`、enforce `max_cycles`；`CowboyHost` 实现 host API（state_get/set、send_message、call_"}, {"id": "route-registry", "parent": "gateway", "importance": "mid", "status": "draft", "deps": [], "specs": ["CIP-14", "CIP-16"], "desc": "CIP-14 v2.r2 的 ingress 命名权威：维护 FQDN → actor 规范映射（注册/续费/转让/反查），CIP-16 v2 扩展到三类命名空间（`cowboy.network` / `.cow`|`.cowboy` / 外部 FQDN），用 `DomainBinding` 结构（`RouteRegistration` 的超集）。方法均为到 `0x0D` 的 ActorMessage，唯一新 SystemInstruc"}, {"id": "runner-delegation", "parent": "runner", "importance": "mid", "status": "draft", "deps": ["settlement-slashing", "vrf-runner-selection"], "specs": ["CIP-13"], "desc": "CBY 持有人锁定委托给 Runner，提升其有效质押（`effective_stake = self_stake + total_active`，直接进 VRF 权重与最大 Job 价值），换取结算分成。协议只实现最小 hook（注册/分账/slash 级联/解绑）；tranche 记账、per-epoch slash cap（500 bps）、24h unbonding 均在 spec。"}, {"id": "runner-lifecycle", "parent": "runner", "importance": "high", "status": "authoritative", "deps": ["vrf-runner-selection", "runner-verification", "settlement-slashing"], "specs": ["CIP-2"], "desc": "7 阶段：Registration（stake ≥ 10,000 CBY，每活跃 Job 占 1.5× max_job_value）→ Job Discovery（VRF 选择）→ Off-chain Execution（LLM/HTTP/MCP，secp256k1 签名）→ Result Submission & Verification → Dispute Window（75 块）→ Settlement → Slashing（异常"}, {"id": "runner-verification", "parent": "runner", "importance": "high", "status": "authoritative", "deps": ["settlement-slashing"], "specs": ["CIP-2", "CIP-16", "CIP-23"], "desc": "每个 Job 声明验证策略，Result Verifier（`0x03`）据此判定结果可信度：None / EconomicBond / MajorityVote / StructuredMatch / Deterministic（TEE + 字节级）/ SemanticSimilarity。MajorityVote/StructuredMatch 用 commit-reveal 防抄袭。"}, {"id": "runner", "parent": null, "importance": "high", "status": "authoritative", "deps": [], "specs": ["CIP-2"], "desc": "Cowboy 链下计算子系统：注册质押的 Runner 节点执行 LLM/HTTP/MCP 任务，链上系统 Actor（`0x01`–`0x03`）负责选择、验证、结算与惩罚。链上面在 `node/execution/src/runner/`，链下守护进程在独立 `runner/` repo。"}, {"id": "settlement-slashing", "parent": "economics", "importance": "constitutional", "status": "authoritative", "deps": ["dual-gas-model"], "specs": ["CIP-2", "CIP-3", "CIP-13"], "desc": "Runner 任务的经济结算与惩罚。Tip（basefee 以上部分）按 `SettlementConfig{runner_percent, burn_percent, treasury_percent}`（存 `0x09`，`UpdateSettlementConfig` opcode 40，仅 `0x09` 可改）分配；basefee 部分 100% burn。Slash 默认 50% Treasury / 50% Burn，sta"}, {"id": "speculative-execution", "parent": "execution", "importance": "high", "status": "authoritative", "deps": ["timer-mechanism"], "specs": [], "desc": "propose/verify 阶段执行进 WriteBuffer（可回滚），report 阶段才 `apply_cached_batch` 落盘 QMDB。块内流程：begin_batch → execute_txs → fire_timers → sweep_deferred → compute_roots → cache → rollback。gas 按 lane 分区（USER/RUNNER/TIMER/SYSTEM）避免 pri"}, {"id": "storage", "parent": "node", "importance": "high", "status": "authoritative", "deps": [], "specs": ["CIP-4"], "desc": "QMDB 支撑的链上状态：账户、actor、actor storage、mailbox、timer、receipt。`BlockchainStorage` 提供批量执行、写缓冲、Merkle root 计算、gas lane 分区与 burn/tip 分配。"}, {"id": "system-actors", "parent": "node", "importance": "high", "status": "authoritative", "deps": [], "specs": ["CIP-2", "CIP-12"], "desc": "Genesis 初始化、拥有特权操作的协议级 Actor。代码已实装部署型 `0x01`–`0x0C`（`SystemActorAddresses` 12 个常量）+ 虚拟拦截型 `0x1D`（Event Subscription）。"}, {"id": "tee-attestation", "parent": "runner", "importance": "mid", "status": "draft", "deps": ["runner-verification"], "specs": ["CIP-23", "CIP-24"], "desc": "把 `Deterministic + tee_required` 从字段存在性检查升级为密码学强制。引入 Composite Attestation Envelope（CAE）绑定 CPU TEE quote（TDX/SEV-SNP/Nitro）+ NVIDIA NCC GPU report + service signature，由 TEE Verifier `0x05` 跑 7 步验证流水线（Freshness→Replay→Cer"}, {"id": "timer-mechanism", "parent": "execution", "importance": "mid", "status": "authoritative", "deps": ["basefee", "actor-model"], "specs": ["CIP-1", "CIP-5"], "desc": "Actor 用 `schedule_timer` / `schedule_timer_ex` 注册未来块高触发的回调。CIP-5 revision（2026-04-20）升级为收费 + 有 TTL + 显式 `fee_payer` 模型：每次 fire 按 basefee 预扣 `max_cost` 再退还差额，三路退出（natural fire / TTL expiry / insufficient-funds self-destru"}, {"id": "verifiable-state-read", "parent": "gateway", "importance": "mid", "status": "draft", "deps": ["dns-addressable-actors"], "specs": ["CIP-17", "CIP-4"], "desc": "加一条 RPC `GET /state/{actor}/{key}?prove=true` 返回 `(value, merkle_proof, state_root, block_height)`，客户端本地验证 Merkle 证明再信任 value（零 PVM cycles）。是 CIP-15 v2 Gateway 路由缓存与 CIP-19 `tools/list` 派生的唯一硬阻塞 RPC；复用 CIP-4 已有 MPT trie "}, {"id": "vrf-runner-selection", "parent": "runner", "importance": "high", "status": "authoritative", "deps": ["runner-verification"], "specs": ["CIP-2", "CIP-13", "CIP-23"], "desc": "Job Dispatcher（`0x02`）用确定但不可预测的算法从 Runner 池选 N 个：先过滤（能力、stake ≥ 1.5× max_job_value、未冻结），按 `weight = floor(log₂(stake/MIN_STAKE + 1)) + 1` 对数化权重，用 `seed = VRF(prev_block_hash ‖ job_id ‖ epoch)` 驱动 Fisher-Yates 洗牌抽取。"}]</script>
<script>
(function(){
  const C = JSON.parse(document.getElementById('data').textContent);
  const byId = Object.fromEntries(C.map(c=>[c.id,c]));
  const IMP_RANK = {constitutional:0,high:1,mid:2,low:3};
  const TIER = {constitutional:'c',high:'h',mid:'m',low:'m'};
  const ROOT_ORDER = ['node','economics','runner','gateway','cross-chain'];

  const kids={};
  C.forEach(c=>{ if(c.parent) (kids[c.parent]=kids[c.parent]||[]).push(c.id); });
  Object.values(kids).forEach(a=>a.sort((x,y)=>(IMP_RANK[byId[x].importance]-IMP_RANK[byId[y].importance])||x.localeCompare(y)));
  const roots = C.filter(c=>!c.parent).map(c=>c.id).sort((a,b)=>{
    const ia=ROOT_ORDER.indexOf(a), ib=ROOT_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib);
  });

  const revAdj={}; C.forEach(c=>revAdj[c.id]=[]);
  C.forEach(c=>(c.deps||[]).forEach(d=>{ if(revAdj[d]) revAdj[d].push(c.id); }));
  function blast(id){ const seen=new Set(),st=[...revAdj[id]];
    while(st.length){const n=st.pop();if(seen.has(n))continue;seen.add(n);revAdj[n].forEach(x=>{if(!seen.has(x))st.push(x);});}
    return [...seen].sort(); }
  const directDependents = id => [...revAdj[id]].sort();

  const state={sel:null,filter:'all',q:''};

  function matches(c){
    if(state.filter!=='all' && c.status!==state.filter) return false;
    if(state.q){const q=state.q.toLowerCase(); if(!c.id.toLowerCase().includes(q)&&!(c.desc||'').toLowerCase().includes(q)) return false;}
    return true;
  }
  function visibleSet(){
    if(state.filter==='all' && !state.q) return null;
    const vis=new Set();
    C.forEach(c=>{ if(matches(c)){ let n=c; while(n){vis.add(n.id); n=n.parent?byId[n.parent]:null;} }});
    return vis;
  }

  // ---- tidy horizontal tree layout ----
  const COL=212, ROW=40, ROOTGAP=30, NODE_W=176, MX=30, MY=26;
  const pos={};                 // id -> {x,y,depth}
  let maxDepth=0, cursorY=0;
  function layout(){
    Object.keys(pos).forEach(k=>delete pos[k]);
    maxDepth=0; cursorY=MY;
    const vis=visibleSet();
    const visChildren = id => (kids[id]||[]).filter(k=>!vis||vis.has(k));
    function place(id,depth){
      maxDepth=Math.max(maxDepth,depth);
      const ch=visChildren(id);
      if(!ch.length){ const y=cursorY; cursorY+=ROW; pos[id]={x:MX+depth*COL,y,depth}; return y; }
      const ys=ch.map(k=>place(k,depth+1));
      const y=(ys[0]+ys[ys.length-1])/2; pos[id]={x:MX+depth*COL,y,depth}; return y;
    }
    for(const r of roots){ if(vis&&!vis.has(r))continue; place(r,0); cursorY+=ROOTGAP; }
  }

  const stage=document.getElementById('stage');
  const svg=document.getElementById('links');
  const esc = s => (s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

  function renderTree(){
    layout();
    const ids=Object.keys(pos);
    const W=MX*2+(maxDepth+1)*COL+NODE_W, H=cursorY+MY;
    stage.style.width=W+'px'; stage.style.height=H+'px';
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.setAttribute('width',W); svg.setAttribute('height',H);

    // links
    const vis=visibleSet();
    const hot = state.sel? new Set([state.sel, ...blast(state.sel)]) : null;
    let paths='';
    for(const id of ids){
      const c=byId[id]; if(!c.parent||!pos[c.parent]) continue;
      const p=pos[c.parent], q=pos[id];
      const x1=p.x+NODE_W, y1=p.y+16, x2=q.x, y2=q.y+16;
      const mx=(x1+x2)/2;
      const isHot = hot && hot.has(id) && hot.has(c.parent);
      paths+=`<path class="${isHot?'hot':''}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
    }
    svg.innerHTML=paths;

    // nodes
    stage.querySelectorAll('.node').forEach(n=>n.remove());
    const frag=document.createDocumentFragment();
    for(const id of ids){
      const c=byId[id], p=pos[id];
      const el=document.createElement('div');
      const kc=(kids[id]||[]).filter(k=>!vis||vis.has(k)).length;
      el.className='node'+(p.depth===0?' root':'')+(c.status==='draft'?' draft':'')+(state.sel===id?' sel':'')
        + (hot && !hot.has(id) ? ' dim':'');
      el.style.left=p.x+'px'; el.style.top=p.y+'px'; el.style.maxWidth=(NODE_W)+'px';
      el.setAttribute('data-id',id); el.setAttribute('tabindex','0'); el.setAttribute('role','treeitem');
      el.innerHTML=`<span class="ndot ${TIER[c.importance]}"></span><span class="nlabel">${esc(id)}</span>`
        + (kc?`<span class="kidcount">${kc}</span>`:'');
      frag.appendChild(el);
    }
    stage.appendChild(frag);
  }

  // ---- inspector ----
  const inspEl=document.getElementById('insp');
  const tierPill = imp => `<span class="pill tier ${TIER[imp]}"><span class="pd"></span>${imp}</span>`;
  const statusPill = st => st==='authoritative'?`<span class="pill ok">✓ code-anchored</span>`:`<span class="pill spec">◇ spec-only</span>`;
  const depChip = id => { const c=byId[id]; return `<span class="chip" data-goto="${id}"><span class="cd" style="background:var(--tier-${TIER[c.importance]})"></span>${esc(id)}</span>`; };
  function renderEmpty(){
    const n=C.length, con=C.filter(c=>c.importance==='constitutional').length, auth=C.filter(c=>c.status==='authoritative').length;
    inspEl.innerHTML=`<div class="empty"><h2>Cowboy 概念樹</h2>
      這是 <code>marshal_pack_cowboy</code> 的概念層級——marshal plan-gate 用它把一份 plan 換算成不可造假的概念成本。點任一節點看它的 tier、依賴與 <b>blast radius</b>(改動傳遞影響的概念數)。
      <div class="statgrid">
        <div class="stat"><div class="n">${n}</div><div class="l">概念總數 · 5 根</div></div>
        <div class="stat"><div class="n" style="color:var(--tier-c)">${con}</div><div class="l">constitutional</div></div>
        <div class="stat"><div class="n" style="color:var(--ok)">${auth}</div><div class="l">code-anchored</div></div>
        <div class="stat"><div class="n" style="color:var(--spec)">${n-auth}</div><div class="l">spec-only</div></div>
      </div></div>`;
  }
  function renderInsp(){
    if(!state.sel){ renderEmpty(); return; }
    const c=byId[state.sel];
    const deps=(c.deps||[]).filter(d=>byId[d]), dep2=directDependents(c.id), bl=blast(c.id);
    const parent=c.parent?`<span class="pill parent" data-goto="${c.parent}">↑ ${esc(c.parent)}</span>`:'';
    inspEl.innerHTML=`
      <div class="ihead"><h1>${esc(c.id)}</h1><span class="tid">${esc(c.id)}</span></div>
      <div class="pills">${tierPill(c.importance)}${statusPill(c.status)}${parent}</div>
      <p class="desc">${esc(c.desc||'')}</p>
      <div class="sec"><h3>依賴 depends_on <span class="cnt">${deps.length}</span></h3>
        <div class="chips">${deps.length?deps.map(depChip).join(''):'<span class="none">無 — 地基概念</span>'}</div></div>
      <div class="sec"><h3>被依賴 dependents <span class="cnt">${dep2.length}</span></h3>
        <div class="chips">${dep2.length?dep2.map(depChip).join(''):'<span class="none">無直接下游</span>'}</div></div>
      <div class="sec"><h3>Blast radius · 改動傳遞面</h3>
        <div class="blast"><div class="top"><span class="bn" style="color:${bl.length?'var(--tier-c)':'var(--text2)'}">${bl.length}</span><span class="bl">個概念會被傳遞影響</span></div>
          <div class="note">${bl.length?'重定義本概念時,以下概念經 depends_on 鏈受牽連 → '+bl.map(esc).join('、'):'零下游 — 改動不會外溢。'}</div></div></div>
      <div class="sec"><h3>Spec 依據 <span class="cnt">${(c.specs||[]).length}</span></h3>
        <div class="chips">${(c.specs||[]).length?c.specs.map(s=>`<span class="chip cip static">${esc(s)}</span>`).join(''):'<span class="none">無</span>'}</div></div>`;
  }
  function renderStatus(){
    const vis=visibleSet(), shown=vis?vis.size:C.length;
    const con=C.filter(c=>c.importance==='constitutional').length, auth=C.filter(c=>c.status==='authoritative').length;
    document.getElementById('status-count').innerHTML=(vis?`顯示 ${shown} / ${C.length}`:`${C.length} 概念`)
      +` &nbsp;·&nbsp; ${con} constitutional &nbsp;·&nbsp; ${auth} code-anchored / ${C.length-auth} spec-only`;
  }

  // ---- interactions ----
  const canvas=document.getElementById('canvas');
  stage.addEventListener('click',e=>{ const n=e.target.closest('.node'); if(n) select(n.getAttribute('data-id')); });
  stage.addEventListener('keydown',e=>{ const n=e.target.closest('.node'); if(n&&(e.key==='Enter'||e.key===' ')){ select(n.getAttribute('data-id')); e.preventDefault(); } });
  inspEl.addEventListener('click',e=>{ const g=e.target.closest('[data-goto]'); if(g) select(g.getAttribute('data-goto')); });
  function select(id){
    state.sel=id; renderTree(); renderInsp();
    const el=stage.querySelector(`.node[data-id="${CSS.escape(id)}"]`);
    if(el) el.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
  }
  document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{
    state.filter=b.getAttribute('data-filter');
    document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));
    renderTree(); renderStatus();
  }));
  document.getElementById('q').addEventListener('input',e=>{ state.q=e.target.value.trim(); renderTree(); renderStatus(); });

  // drag-to-pan on empty canvas
  let panning=false,sx,sy,sl,st_;
  canvas.addEventListener('pointerdown',e=>{ if(e.target.closest('.node'))return;
    panning=true;sx=e.clientX;sy=e.clientY;sl=canvas.scrollLeft;st_=canvas.scrollTop;canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing'; });
  canvas.addEventListener('pointermove',e=>{ if(!panning)return; canvas.scrollLeft=sl-(e.clientX-sx); canvas.scrollTop=st_-(e.clientY-sy); });
  canvas.addEventListener('pointerup',e=>{ panning=false;canvas.style.cursor=''; });

  renderTree(); renderStatus(); select('gas');
})();
</script>

name: "Marshal Invariant Reporter"
description: "向 Marshal 大脑拉取适用不变量, 在本 repo CI 执行并回报 (影子安全, 不阻断)"
inputs:
  brain-url:
    description: "Marshal 大脑 URL"
    required: true
  repo:
    description: "本 repo 在 Marshal 领域包中的标识"
    required: true
  base-ref:
    description: "比较基线; 缺省按事件推导 (PR: base SHA / push: before / merge_group: base_sha)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Compute diff paths
      id: diff
      shell: bash
      env:
        BASE_INPUT: ${{ inputs.base-ref }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
      run: |
        set -euo pipefail
        BASE="$BASE_INPUT"
        if [ -z "$BASE" ]; then
          case "$EVENT_NAME" in
            pull_request|pull_request_target) BASE="$PR_BASE_SHA" ;;
            push)                             BASE="$PUSH_BEFORE" ;;
            merge_group)                      BASE="$MG_BASE_SHA" ;;
          esac
        fi
        if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
          echo "::error::cannot determine a diff base for event '$EVENT_NAME' (new-branch push?); pass base-ref explicitly"
          exit 1
        fi
        if ! git rev-parse -q --verify "$BASE^{commit}" >/dev/null 2>&1; then
          git fetch --no-tags --depth=1 origin "$BASE" || {
            echo "::error::base commit $BASE is not available locally and could not be fetched (shallow checkout?)"
            exit 1
          }
        fi
        if ! PATHS_B64=$(git diff --name-only -z "$BASE" HEAD | base64 -w0); then
          echo "::error::git diff against $BASE failed; refusing to fall back to an empty diff"
          exit 1
        fi
        if [ -z "$PATHS_B64" ]; then
          echo "::warning::empty diff between $BASE and HEAD"
        fi
        echo "paths_b64=$PATHS_B64" >> "$GITHUB_OUTPUT"
    - name: Run Marshal reporter
      shell: bash
      env:
        BRAIN_URL: ${{ inputs.brain-url }}
        REPO_ID: ${{ inputs.repo }}
        DIFF_PATHS_B64: ${{ steps.diff.outputs.paths_b64 }}
        PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
      run: |
        python3 "$GITHUB_ACTION_PATH/src/marshal_core/executor/reporter.py" \
          --brain-url "$BRAIN_URL" \
          --repo "$REPO_ID" \
          --change-ref "$GITHUB_SHA" \
          --diff-paths-b64 "$DIFF_PATHS_B64" \
          --labels-json "$PR_LABELS_JSON"

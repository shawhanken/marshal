[project]
name = "marshal"
version = "0.0.1"
description = "通用质量工程平台"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.15.15"]
# zizmor: deterministic GitHub Actions security auditor — the backstop for `cli ci-scan`
# (CI/CD gate). Without it ci-scan degrades to escalate. Install via `pip install -e .[ci]`.
ci = ["zizmor>=1.0"]
mcp = ["mcp>=1.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
"marshal_core" = ["adapters/static/*.html"]
